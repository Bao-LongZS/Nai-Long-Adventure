<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1060" viewBox="0 0 1600 1060">
  <title>P7 A1 result badges v02 review</title>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#F8F6F0"/><stop offset="1" stop-color="#ECEAE2"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#17284A" flood-opacity="0.11"/></filter>
    <filter id="gray"><feColorMatrix type="saturate" values="0"/></filter>
    <style>
      .title{font:700 36px 'Microsoft YaHei',sans-serif;fill:#14264A}
      .sub{font:400 18px 'Microsoft YaHei',sans-serif;fill:#667086}
      .label{font:700 25px 'Microsoft YaHei',sans-serif;fill:#14264A}
      .body{font:400 16px 'Microsoft YaHei',sans-serif;fill:#667086}
      .small{font:600 14px 'Microsoft YaHei',sans-serif;fill:#536078}
    </style>
  </defs>
  <rect width="1600" height="1060" fill="url(#bg)"/>
  <path d="M0 152H1600" stroke="#D9D9D1" stroke-width="2"/>
  <text x="72" y="82" class="title">P7 / α 结算徽章 · v02</text>
  <text x="74" y="119" class="sub">原创 UI 候选 · 透明图集不含文字 · 48px 与灰度预览</text>
  <rect x="1305" y="56" width="222" height="48" rx="24" fill="#FFF3D7" stroke="#D2B04A" stroke-width="2"/>
  <text x="1416" y="87" text-anchor="middle" class="small">待用户评审</text>

  <g filter="url(#shadow)"><rect x="64" y="190" width="704" height="790" rx="28" fill="#FFFFFF"/></g>
  <g filter="url(#shadow)"><rect x="832" y="190" width="704" height="790" rx="28" fill="#FFFFFF"/></g>

