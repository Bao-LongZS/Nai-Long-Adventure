  <svg x="984" y="302" width="400" height="400" viewBox="432 16 384 384">
    <image href="../P7_A1_ResultBadgeAtlas_v02.png" x="0" y="0" width="832" height="416"/>
  </svg>
  <rect x="870" y="727" width="628" height="1.5" fill="#E3E5E8"/>
  <text x="872" y="768" class="small">48px 彩色（2×）</text>
  <svg x="872" y="785" width="96" height="96" viewBox="0 0 48 48" image-rendering="pixelated">
    <svg x="0" y="0" width="48" height="48" viewBox="432 16 384 384"><image href="../P7_A1_ResultBadgeAtlas_v02.png" x="0" y="0" width="832" height="416"/></svg>
  </svg>
  <text x="1012" y="824" class="small">灰度</text>
  <svg x="1012" y="837" width="72" height="72" viewBox="432 16 384 384" filter="url(#gray)">
    <image href="../P7_A1_ResultBadgeAtlas_v02.png" x="0" y="0" width="832" height="416"/>
  </svg>
