  <g transform="translate(16 16)">
    <ellipse cx="98" cy="98" rx="72" ry="55" fill="url(#dogHalo)"/>
    <path d="M33 83q17 15 0 30m17-44q25 25 0 50" fill="none" stroke="#F08A43" stroke-width="7" opacity=".72"/>
    <circle cx="83" cy="96" r="26" fill="url(#dogShell)" class="ink" stroke-width="4"/>
    <circle cx="126" cy="77" r="13" fill="#FFD77A" class="dogDeep" stroke-width="3"/>
    <circle cx="132" cy="119" r="10" fill="#ED7250" class="ink" stroke-width="3"/>
    <circle cx="78" cy="87" r="7" fill="#FFF7D9" opacity=".94"/>
    <path d="M72 103q10 8 21 0m25-33 5-5m22 46 7 3" fill="none" class="dogLight" stroke-width="3"/>
    <circle cx="154" cy="61" r="3" fill="#FFEAA9"/><circle cx="159" cy="137" r="4" fill="#E97848"/>
  </g>
  <g transform="translate(224 16)">
    <path d="M27 123c23 0 33-20 50-23 17-4 24 9 39 3 13-5 24-18 42-16" fill="none" stroke="#E96C45" stroke-width="22" stroke-linecap="round" opacity=".18"/>
