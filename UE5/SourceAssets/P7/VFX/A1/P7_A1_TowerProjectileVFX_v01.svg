  <g transform="translate(432 224)">
    <ellipse cx="98" cy="98" rx="77" ry="70" fill="url(#mouseHalo)"/>
    <circle cx="98" cy="98" r="48" fill="none" stroke="#43B9AD" stroke-width="7" stroke-dasharray="55 13 28 16" stroke-linecap="round"/>
