<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="848" height="432" viewBox="0 0 848 432">
  <title>P7 A1 tower projectile VFX v01</title>
  <desc>Two four-frame transparent projectile sequences: a resonant area shell for MilkDog and a mint slow-pulse dart for MilkMouse. MilkChicken keeps the existing v07 shot.</desc>
  <defs>
    <radialGradient id="dogHalo"><stop stop-color="#FFF1BF" stop-opacity=".9"/><stop offset=".45" stop-color="#F7A84B" stop-opacity=".48"/><stop offset="1" stop-color="#E86D43" stop-opacity="0"/></radialGradient>
    <linearGradient id="dogShell" x1="0" y1="0" x2="1" y2=".25"><stop stop-color="#F26B49"/><stop offset=".45" stop-color="#FFB64D"/><stop offset=".78" stop-color="#FFE18A"/><stop offset="1" stop-color="#F27C46"/></linearGradient>
    <radialGradient id="mouseHalo"><stop stop-color="#F4FFF1" stop-opacity=".94"/><stop offset=".5" stop-color="#86E5CF" stop-opacity=".5"/><stop offset="1" stop-color="#45BDAE" stop-opacity="0"/></radialGradient>
    <linearGradient id="mouseCrystal" x1="0" y1="0" x2="1" y2=".3"><stop stop-color="#E6FFF1"/><stop offset=".38" stop-color="#80E5D0"/><stop offset=".72" stop-color="#3EB4AB"/><stop offset="1" stop-color="#B5F3D9"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
    <style>
      .ink{stroke:#3B3542;stroke-linecap:round;stroke-linejoin:round}
      .dogLight{stroke:#FFF1CB;stroke-linecap:round;stroke-linejoin:round}
      .dogDeep{stroke:#C7583E;stroke-linecap:round;stroke-linejoin:round}
      .mouseLight{stroke:#E8FFF3;stroke-linecap:round;stroke-linejoin:round}
      .mouseDeep{stroke:#287E79;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

