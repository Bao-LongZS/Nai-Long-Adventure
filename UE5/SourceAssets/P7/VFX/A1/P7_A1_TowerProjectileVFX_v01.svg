    <circle cx="47" cy="58" r="8" fill="#FFCE68" class="dogDeep" stroke-width="2.5"/><circle cx="147" cy="55" r="6" fill="#F27A49"/>
    <circle cx="47" cy="144" r="6" fill="#F6A148"/><circle cx="151" cy="142" r="8" fill="#FFD276" class="dogDeep" stroke-width="2.5"/>
  </g>
  <g transform="translate(640 16)">
    <path d="M44 102a54 54 0 0 1 92-38m10 25a54 54 0 0 1-92 45" fill="none" stroke="#E97549" stroke-width="7" stroke-linecap="round" stroke-dasharray="50 17 26 18" opacity=".75"/>
    <path d="M61 103a36 36 0 0 1 59-27m-1 40a36 36 0 0 1-58 15" fill="none" stroke="#FFD171" stroke-width="4" stroke-linecap="round" stroke-dasharray="37 14 18 14"/>
    <circle cx="97" cy="98" r="18" fill="url(#dogHalo)"/><circle cx="97" cy="98" r="7" fill="#FFE5A0"/>
    <circle cx="49" cy="60" r="6" fill="#F08846"/><circle cx="148" cy="72" r="4" fill="#FFE6A4"/><circle cx="139" cy="137" r="5" fill="#EA7048"/>
    <path d="m61 46 6-8m72 101 8 4m-103 9-7 6" fill="none" class="dogLight" stroke-width="3"/>
  </g>

