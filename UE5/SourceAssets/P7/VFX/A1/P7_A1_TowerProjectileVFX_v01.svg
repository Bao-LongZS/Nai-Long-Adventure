    <path d="M38 126c17-2 27-10 38-18m42 1 14-8" fill="none" class="dogLight" stroke-width="3"/>
    <path d="M64 79 81 63l17 4 10 16-10 24-20 6-16-15Z" fill="url(#dogShell)" class="ink" stroke-width="4"/>
    <circle cx="80" cy="86" r="9" fill="#FFF1C3" class="dogDeep" stroke-width="2.5"/>
    <circle cx="117" cy="105" r="14" fill="#F17D49" class="ink" stroke-width="3"/>
    <circle cx="122" cy="101" r="4" fill="#FFE9A3"/>
    <circle cx="52" cy="75" r="5" fill="#F9B24E"/><circle cx="146" cy="62" r="3.5" fill="#FFE3A0"/>
    <path d="M149 119l10 5m-6-59 10-5" fill="none" stroke="#D95D43" stroke-width="4" stroke-linecap="round"/>
