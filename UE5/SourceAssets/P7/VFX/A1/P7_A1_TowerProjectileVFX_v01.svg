    <circle cx="44" cy="64" r="5" fill="#E5FFF0"/><circle cx="153" cy="76" r="4" fill="#40B7AB"/><circle cx="142" cy="139" r="5" fill="#9BE9D0"/><circle cx="57" cy="140" r="3" fill="#47B7A9"/>
    <path d="M43 107h14m91-54 10-5m-111 94-8 5" fill="none" class="mouseLight" stroke-width="3" stroke-linecap="round"/>
