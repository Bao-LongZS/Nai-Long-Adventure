    <path d="m98 81 5 12 13 5-13 5-5 12-5-12-13-5 13-5Z" fill="#76D8C4" stroke="#287E79" stroke-width="2.5"/>
    <circle cx="42" cy="60" r="5" fill="#93E9D2"/><circle cx="151" cy="58" r="4" fill="#37A79D"/><circle cx="151" cy="140" r="6" fill="#B4F1D8"/>
  </g>
  <g transform="translate(640 224)">
    <path d="M48 98a50 50 0 0 1 83-38m12 26a50 50 0 0 1-83 43" fill="none" stroke="#4AB9AD" stroke-width="7" stroke-linecap="round" stroke-dasharray="42 18 24 16" opacity=".76"/>
