      <stop offset="0" stop-color="#FBF7ED"/>
      <stop offset="1" stop-color="#E9DFC9"/>
    </linearGradient>
    <linearGradient id="arena" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#728275"/>
      <stop offset="1" stop-color="#55685D"/>
    </linearGradient>
