  <title id="title">P4 α 沙丘晒笑场 · 场景可读性深化稿 v02</title>
  <desc id="desc">固定三分之四镜头下的完整竞技场概念：沙岩拱门与低矮边界、开阔灰绿战斗地面、两侧低障碍、清晰的角色和敌群落位，以及形状与颜色双编码预警。</desc>
