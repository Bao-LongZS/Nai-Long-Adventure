<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">憋不住 · 受击笑出能量 · 图标候选 v02</title>
  <desc id="desc">奶蛙被击中后闭眼张嘴大笑，笑声带出能量亮点。</desc>
  <defs>
    <linearGradient id="frog" x1=".15" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#FFE58B"/>
      <stop offset=".64" stop-color="#F5C34F"/>
      <stop offset="1" stop-color="#D99235"/>
    </linearGradient>
    <linearGradient id="tongue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5988A"/>
      <stop offset="1" stop-color="#D85F63"/>
    </linearGradient>
  </defs>
  <!-- Laughter carries energy upward -->
  <path d="M361 229 C400 205 425 178 438 144 M369 268 C417 257 448 236 470 205" fill="none" stroke="#78A86C" stroke-width="17" stroke-linecap="round"/>
