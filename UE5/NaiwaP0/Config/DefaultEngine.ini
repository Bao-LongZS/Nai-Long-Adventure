; ---------------------------------------------------------------------------
; P2 全物理改造（M1）：子步配置
;
; 这几项和 Source/NaiwaRuntime/NaiwaP2PhysicsProfile.h 里的常量是同一个数，
; 改一个必须改另一个 —— ANaiwaP2StructureBlock::VerifyProjectPhysicsSettings()
; 会在运行时比对，不一致直接打 Error，不会静默漂移。
;
; 为什么必须开子步：最细的柱是 0.30 m 宽 x 1.90 m 高（高宽比 6.3）。
; 1/60 步长下单步位移足以让细柱的接触点在两个子步之间"跳过"支撑面，
; 表现为高频抖动或缓慢自倒。
;
; bTickPhysicsAsync=False：异步物理会让同一发的表现不可复现，
; 也让"场景是否停稳"的判定变难。
; ---------------------------------------------------------------------------
[/Script/Engine.PhysicsSettings]
bSubstepping=True
bSubsteppingAsync=False
bTickPhysicsAsync=False
MaxSubstepDeltaTime=0.008333
MaxSubsteps=8

