<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>P4 A3 强化类别标记 v01</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:28px;background:#292b30;color:#f6f0e5;font:15px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}.shell{max-width:1040px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.brand{font-size:12px;font-weight:800;letter-spacing:.12em;color:#e2d4b8}h1{margin:0;font-size:28px}.intro{margin:8px 0 0;color:#c9c0b1}.toggle{padding:9px 13px;border:1px solid #867456;border-radius:999px;background:#35363a;color:#efe7d5;font:inherit;font-weight:700;cursor:pointer}.toggle[aria-pressed="true"]{background:#f2e7d1;color:#49372e}.toggle:focus-visible{outline:3px solid #c69335;outline-offset:3px}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:22px;border:1px solid #c9ad76;border-radius:20px;background:linear-gradient(135deg,#fffaf0,#f2e7d1);color:#49372e}.item{padding:18px;border:1px solid #d9c9aa;border-radius:15px;background:#fffdf7}.item h2{margin:0 0 4px;font-size:18px}.type{margin:0;color:#75634c;font-size:12px}.large{display:grid;place-items:center;min-height:130px;margin:14px 0;border:1px solid #e4d6bc;border-radius:12px;background:#f7efdf}.large img{width:64px;height:64px}.scales{display:flex;align-items:center;gap:14px}.scale{display:flex;align-items:center;gap:7px;color:#6f604c;font-size:12px}.scale img{width:16px;height:16px}.scale.big img{width:24px;height:24px}.foot{margin:15px 5px 0;color:#c2b9a8;font-size:12px}.gray .board{filter:grayscale(1)}@media(max-width:760px){body{padding:15px}.top{align-items:flex-start;flex-direction:column}.board{grid-template-columns:1fr}}
</style>
</head>
<body><main class="shell">
<header class="top"><div><div class="brand">NAIWA · P4 α · CATEGORY CUES</div><h1>强化类别标记</h1><p class="intro">圆点、菱形、星芒与类别文字共同识别；切换灰度检查只用于观察轮廓区分。</p></div><button class="toggle" id="toggle" type="button" aria-pressed="false">灰度检查：关</button></header>
<section class="board">
<article class="item"><h2>子弹强化</h2><p class="type">圆点 · 暖金色</p><div class="large"><img src="../../../../SourceAssets/P4/UI/Alpha/CategoryMarks/P4_A3_CategoryMark_bullet_v01.svg" alt="子弹强化圆点标记"></div><div class="scales"><span class="scale"><img src="../../../../SourceAssets/P4/UI/Alpha/CategoryMarks/P4_A3_CategoryMark_bullet_v01.svg" alt=""><span>16 px</span></span><span class="scale big"><img src="../../../../SourceAssets/P4/UI/Alpha/CategoryMarks/P4_A3_CategoryMark_bullet_v01.svg" alt=""><span>24 px</span></span></div></article>
<article class="item"><h2>冲撞强化</h2><p class="type">菱形 · 叶绿色</p><div class="large"><img src="../../../../SourceAssets/P4/UI/Alpha/CategoryMarks/P4_A3_CategoryMark_charge_v01.svg" alt="冲撞强化菱形标记"></div><div class="scales"><span class="scale"><img src="../../../../SourceAssets/P4/UI/Alpha/CategoryMarks/P4_A3_CategoryMark_charge_v01.svg" alt=""><span>16 px</span></span><span class="scale big"><img src="../../../../SourceAssets/P4/UI/Alpha/CategoryMarks/P4_A3_CategoryMark_charge_v01.svg" alt=""><span>24 px</span></span></div></article>
<article class="item"><h2>大笑强化</h2><p class="type">星芒 · 珊瑚色</p><div class="large"><img src="../../../../SourceAssets/P4/UI/Alpha/CategoryMarks/P4_A3_CategoryMark_laugh_v01.svg" alt="大笑强化星芒标记"></div><div class="scales"><span class="scale"><img src="../../../../SourceAssets/P4/UI/Alpha/CategoryMarks/P4_A3_CategoryMark_laugh_v01.svg" alt=""><span>16 px</span></span><span class="scale big"><img src="../../../../SourceAssets/P4/UI/Alpha/CategoryMarks/P4_A3_CategoryMark_laugh_v01.svg" alt=""><span>24 px</span></span></div></article>
</section><p class="foot">视觉源稿已基于 v03 通过的类别形状制作。此页是源图预览，不是 UMG/UE 运行时验收；缩放到 16 px 后仍需在目标 DPI 与真实背景中复核。</p>
</main><script>const t=document.getElementById("toggle");t.addEventListener("click",()=>{const active=document.body.classList.toggle("gray");t.setAttribute("aria-pressed",String(active));t.textContent=active?"灰度检查：开":"灰度检查：关";});</script></body></html>
